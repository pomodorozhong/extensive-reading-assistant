}.notice-strip{padding:13px 16px;background:#f4f8fc;border:1px solid #e3edf5;border-radius:8px;font-size:12.5px;line-height:1.55;color:#6b8197;margin-top:18px}.prompt-illustration{width:48px;height:48px;margin:0 auto 15px;background:#eaf4ff;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:21px;color:#0a7bec}.dialog-actions{display:flex;gap:10px;margin-top:23px}.dialog-actions button{flex:1}.modal.prompt{width:min(510px,100%)}.modal.prompt h2{font-size:25px}.modal.prompt .desc{max-width:390px;margin:0 auto}.topic-dot{height:6px;width:6px;border-radius:50%;background:#5eaf8c;display:inline-block;margin-right:3px}.word-source{font-size:12px;color:#7a8a9d;margin-top:11px}.quiz-source{display:inline-flex;align-items:center;gap:7px;border:1px solid #ddeaf7;background:#f6faff;color:#387aba;font-size:12px;border-radius:6px;padding:6px 9px;margin:7px 0 2px}.card.word-card{padding:20px}.dict-summary{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.exam-container{max-width:950px;margin:0 auto}.statline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.saved-feedback{font-size:12px;color:#0877dc;margin-top:8px}.flow-note-link{font-size:12px;color:#6e7b8d}.pill.gray{background:#f5f7f9;color:#657185}.back-skip{font-size:12.5px;color:#778498;line-height:1.5;margin:12px 0}.how-it-works{margin-top:38px;border-top:1px solid var(--line);padding-top:26px}.how-it-works h2{font-size:19px}.how-it-works p{font-size:13px;line-height:1.6;color:var(--muted)}

<body>
<header class="site-header"><div class="head-inner"><a href="#new" class="brand">Extensive Reading</a><nav id="nav" class="navigation" aria-label="Main navigation"></nav></div></header>
<main id="app"></main>
<footer class="site-footer"><div class="container footer-row"><span>Extensive Reading · Interactive exam workflow prototype</span><span>Demo stories &amp; questions · No API required · Progress saved locally</span></div></footer>
<div id="modal-host"></div><div id="dict-host"></div>
<script>
(()=>{'use strict';
const STORIES=[
{id:'bookshop',title:'A Rainy Afternoon at the Bookshop',theme:'A rainy afternoon at a bookshop',level:'B2',minutes:3,description:'An unexpected note turns a quiet afternoon into a small act of kindness.',words:[
{term:'serendipity',definition:'a pleasant discovery made by chance',example:'Finding the note was an act of serendipity.',part:'noun'},
{term:'murmur',definition:'a low, continuous sound',example:'A murmur of conversation drifted from the back room.',part:'noun'},
{term:'linger',definition:'to stay somewhere longer than expected',example:'Maya decided to linger after the rain stopped.',part:'verb'},
{term:'unassuming',definition:'modest and not trying to attract attention',example:'The shop had an unassuming entrance.',part:'adjective'},
{term:'reassure',definition:'to make someone feel less worried',example:'The bookseller tried to reassure her.',part:'verb'}],
paragraphs:[
'At four o’clock, rain tapped on the windows of an unassuming bookshop between a bakery and a tailor’s studio. Maya had entered simply to escape the weather. She expected to browse for ten minutes, then continue home.',
'As she opened a secondhand novel, a folded piece of paper slipped from its pages. It read, “If you find this, please return the book to the woman who taught me to love stories.” Beneath the message was the name of the bookseller, Mrs. Chen. Maya wondered whether the discovery was pure serendipity.',
'A murmur of conversation drifted from the back room. When Maya showed Mrs. Chen the note, the bookseller grew quiet. She explained that her former student had moved overseas years ago. The note was written before he left, but she had never seen it. Maya tried to reassure her that it was not too late to reconnect.',
'By the time the clouds cleared, Maya had missed her bus. She chose to linger anyway, helping Mrs. Chen compose a short message to her former student. She left without buying a book, but with the feeling that a quiet afternoon had become something memorable.'
],questions:[
{q:'Why did Maya first enter the bookshop?',options:['She wanted to avoid the rain.','She had arranged to meet Mrs. Chen.','She needed to buy a gift.','She was looking for a missing book.'],correct:0,explanation:'Maya entered the bookshop to escape the rain, not because she had planned a visit.'},
{q:'What was written on the note inside the novel?',options:['An invitation to a public reading.','A request to return the book to a former teacher.','A list of recommended novels.','Directions to a nearby bakery.'],correct:1,explanation:'The note asked the finder to return the book to the woman who inspired the writer’s love of stories.'},
{q:'How did Mrs. Chen respond to the note?',options:['She immediately threw it away.','She did not recognize the handwriting.','She became quiet and recalled a former student.','She asked Maya to keep the novel.'],correct:2,explanation:'Mrs. Chen grew quiet and explained that a former student had moved overseas years earlier.'},
{q:'What is the main idea of the story?',options:['Buying used books can be expensive.','Unexpected encounters can create meaningful connections.','Public transportation is unreliable in bad weather.','People should avoid visiting shops alone.'],correct:1,explanation:'The chance discovery led Maya to help reconnect a teacher and student.'}]},
{id:'tokyo',title:'A Weekend in Tokyo',theme:'A weekend in Tokyo',level:'B2',minutes:3,description:'A missed train leads a traveler to discover a slower side of the city.',words:[
{term:'detour',definition:'a different route taken instead of the usual one',example:'The closed station forced a detour.',part:'noun'},
{term:'navigate',definition:'to find a way through or around a place',example:'He learned to navigate the narrow streets.',part:'verb'},
{term:'fleeting',definition:'lasting for a very short time',example:'The view of the sunset was fleeting.',part:'adjective'},
{term:'deliberate',definition:'done carefully and with intention',example:'He made a deliberate choice to slow down.',part:'adjective'},
{term:'intricate',definition:'made of many small, detailed parts',example:'An intricate paper lantern hung outside.',part:'adjective'}],
paragraphs:[
'Jun arrived in Tokyo with a detailed itinerary: galleries in the morning, shopping in the afternoon, and a rooftop view at sunset. On his second day, however, a temporary train closure forced a detour through a quiet neighborhood he had never heard of.',
'At first, he was frustrated. He struggled to navigate the narrow streets without constantly checking his phone. Then he noticed a small workshop where an artist was assembling an intricate paper lantern. The artist invited him inside and explained the patience needed to make each fold.',
'Jun bought a cup of tea at the next shop and watched people pass. The sunlight between the buildings was fleeting, but he found himself enjoying the moment rather than trying to capture it. He made a deliberate decision to abandon the rest of his afternoon schedule.',
'He still visited the gallery the following day. Yet when friends later asked about his favorite place in Tokyo, he described the workshop, the tea, and the unplanned walk. The city had rewarded him most when he stopped trying to see everything.'
],questions:[
{q:'What caused Jun to change his original route?',options:['A train station was temporarily closed.','He forgot his hotel address.','His phone stopped working.','A friend invited him elsewhere.'],correct:0,explanation:'The story states that a temporary train closure forced Jun to take a detour.'},
{q:'What was the artist making in the workshop?',options:['A ceramic tea cup.','An intricate paper lantern.','A wooden bookshelf.','A printed city map.'],correct:1,explanation:'Jun saw an artist carefully assembling a paper lantern.'},
{q:'Why did Jun abandon his afternoon schedule?',options:['The gallery was sold out.','The weather had turned dangerous.','He decided to enjoy the moment without rushing.','He wanted to return to his hotel.'],correct:2,explanation:'He consciously slowed down and enjoyed the unexpected neighborhood experience.'},
{q:'Which theme best summarizes the story?',options:['Travel is better when every minute is planned.','Unexpected changes can lead to rewarding discoveries.','Large cities are easier to navigate without maps.','Shopping is the most memorable part of traveling.'],correct:1,explanation:'Jun’s favorite memory arose from a disruption to his itinerary.'}]},
{id:'package',title:'The Mysterious Package',theme:'A mysterious package',level:'B2',minutes:3,description:'A curious delivery offers clues to a forgotten family tradition.',words:[
{term:'peculiar',definition:'strange or unusual',example:'The handwriting on the parcel was peculiar.',part:'adjective'},
{term:'hesitate',definition:'to pause because of uncertainty',example:'Noah began to hesitate before opening the box.',part:'verb'},
{term:'decipher',definition:'to work out the meaning of something unclear',example:'He tried to decipher the faded message.',part:'verb'},
{term:'reluctant',definition:'unwilling or not eager to do something',example:'Noah was reluctant to disturb the old paper.',part:'adjective'},
{term:'reveal',definition:'to make something previously hidden known',example:'The photograph would reveal the truth.',part:'verb'}],
paragraphs:[
'On a Saturday morning, Noah found a small package outside his apartment. It had no return address, only his name written in peculiar handwriting. Inside was a brass key, a faded photograph of an old theater, and a card bearing the words “First row, last seat.”',
'Noah began to hesitate. The theater in the photograph had closed decades earlier, and his grandmother had once worked there. He was reluctant to disturb her with questions, since she rarely spoke about that part of her life.',
'Instead, he visited the city archive to decipher the faded writing on the back of the photograph. The archivist identified the building and showed him a newspaper article about the theater’s final performance. The article included a picture of his grandmother standing on stage.',
'When Noah finally showed her the photograph, she smiled. The key had once opened a small box beneath the final seat, where the cast left messages for future performers. The package did not reveal a hidden fortune; it revealed a story she had wanted someone in the family to remember.'
],questions:[
{q:'Which object was NOT in the package?',options:['A brass key.','An old photograph.','A newspaper article.','A card with a message.'],correct:2,explanation:'The newspaper article was discovered later at the city archive, not inside the package.'},
{q:'Why was Noah initially reluctant to ask his grandmother?',options:['She had moved overseas.','She rarely spoke about her theater years.','She did not remember the theater.','He thought she had sent the package.'],correct:1,explanation:'Noah hesitated because his grandmother seldom discussed that period of her life.'},
{q:'Where did Noah learn more about the photograph?',options:['At the city archive.','At his apartment building.','At a local bookstore.','At a train station.'],correct:0,explanation:'An archivist found a relevant newspaper article in the city archive.'},
{q:'What did the package ultimately reveal?',options:['A forgotten family story.','A large inheritance.','The location of a new theater.','An upcoming performance.'],correct:0,explanation:'The key and photograph helped bring his grandmother’s theater story back into the family.'}]},
{id:'dog',title:'My Dog’s Unexpected Adventure',theme:"My dog's adventure",level:'B1',minutes:3,description:'A clever dog turns a routine walk into a neighborhood mystery.',words:[
{term:'venture',definition:'to go somewhere unfamiliar or potentially risky',example:'Pippin decided to venture off the usual route.',part:'verb'},
{term:'trail',definition:'a path through the countryside or a park',example:'The trail curved beside the stream.',part:'noun'},
{term:'alert',definition:'watchful and ready to notice things',example:'The dog became alert when it heard a sound.',part:'adjective'},
{term:'retrieve',definition:'to bring something back',example:'Pippin helped retrieve the lost mitten.',part:'verb'},
{term:'familiar',definition:'well known from previous experience',example:'They returned to their familiar path.',part:'adjective'}],
paragraphs:[
'Every morning, Pippin and his owner, Leah, walked the familiar trail beside the neighborhood stream. Pippin usually followed the same routine: sniff the first tree, wait by the bridge, and hurry home for breakfast.',
'One cool morning, however, he became alert when he heard a faint cry from the far side of the bridge. He began to venture down a narrow path Leah had never noticed. She followed carefully, wondering what had caught his attention.',
'Near a fallen tree, they found a child searching the grass for a lost red mitten. Pippin sniffed around the roots and managed to retrieve it from beneath a pile of leaves. The child laughed with relief.',
'Leah thanked Pippin with an extra treat when they returned home. Their ordinary walk had taken a different route, but it reminded her that paying attention to small things could make a surprising difference.'
],questions:[
{q:'Where did Pippin and Leah usually walk?',options:['Beside a neighborhood stream.','Through a crowded market.','Along a beach.','Inside a shopping center.'],correct:0,explanation:'Their usual path was a trail beside the neighborhood stream.'},
{q:'What first drew Pippin away from the usual route?',options:['The smell of breakfast.','A faint cry from beyond the bridge.','A passing bicycle.','A loud thunderstorm.'],correct:1,explanation:'Pippin became alert after hearing a faint cry.'},
{q:'What did Pippin find?',options:['A lost key.','A red mitten.','A ball.','A small bird.'],correct:1,explanation:'He retrieved the missing red mitten from beneath fallen leaves.'},
{q:'What lesson does Leah take from the experience?',options:['Walks should always be shorter.','The bridge should be avoided.','Small observations can help others.','Dogs should never explore.'],correct:2,explanation:'Leah realized that noticing small things can make a difference.'}]},
{id:'space',title:'Life on a Space Station',theme:'Life on a space station',level:'B2',minutes:3,description:'An astronaut learns how small routines keep a crew connected.',words:[
{term:'orbit',definition:'to travel around another object in space',example:'The station continued to orbit Earth.',part:'verb'},
{term:'fragile',definition:'easily damaged or broken',example:'The seedlings looked fragile in the container.',part:'adjective'},
{term:'anticipate',definition:'to expect something before it happens',example:'The crew learned to anticipate small problems.',part:'verb'},
{term:'isolate',definition:'to separate or keep apart from others',example:'The long mission could isolate crew members.',part:'verb'},
{term:'resilient',definition:'able to recover well after difficulties',example:'The plants proved surprisingly resilient.',part:'adjective'}],
paragraphs:[
'The space station continued to orbit Earth every ninety minutes, but for astronaut Elena, the days sometimes felt strangely similar. She checked scientific instruments, ate meals with her crew, and recorded short messages for home.',
'One experiment involved raising fragile seedlings in a small growing chamber. The team had to anticipate changes in humidity and temperature before the plants showed signs of stress. At first, several leaves turned yellow, and Elena feared the experiment would fail.',
'To avoid letting the repetitive routine isolate the crew, Elena began inviting everyone to check the plants after dinner. Their daily conversations soon became as important as the measurements. They shared stories, joked about the seedlings, and worked together to solve a minor ventilation problem.',
'Two weeks later, the plants were healthy again. Elena described them as resilient, but she knew the same word could describe the crew. Caring for something small had helped them maintain a sense of purpose far from home.'
],questions:[
{q:'What were the astronauts growing?',options:['Small seedlings.','Mushrooms.','Fruit trees.','Seaweed.'],correct:0,explanation:'The crew was raising fragile seedlings in a growing chamber.'},
{q:'Which conditions did the crew monitor?',options:['Wind and sunlight on Earth.','Humidity and temperature.','Ocean depth and pressure.','Weather outside the station.'],correct:1,explanation:'The text specifically mentions humidity and temperature.'},
{q:'Why did Elena invite the crew to check the plants after dinner?',options:['To replace scientific measurements.','To make their meals shorter.','To encourage connection and shared purpose.','To prepare for an emergency landing.'],correct:2,explanation:'The shared ritual helped prevent the crew from feeling isolated.'},
{q:'What does the story suggest about resilience?',options:['Only plants can recover from setbacks.','Routine work never helps people.','Small shared activities can help people through difficulties.','Teamwork is unnecessary in space.'],correct:2,explanation:'Both the plants and crew recovered through consistent attention and collaboration.'}]}
];


const BY_ID=Object.fromEntries(STORIES.map(s=>[s.id,s]));
const STORE='extensive-reading-exam-redesign-v1';
const allWords=()=>STORIES.flatMap(s=>s.words.map(w=>({...w,storyId:s.id,story:s.title})));
const initialSaved=['bookshop:serendipity','bookshop:linger','tokyo:detour','tokyo:fleeting','package:peculiar','station:adapt','space:resilience'];
// Default samples are overwritten if the underlying demonstration story set uses different ids.
const seededWords=()=>{const all=allWords();const found=initialSaved.filter(key=>all.some(w=>w.storyId+':'+w.term===key));return found.length>=5?found:all.filter((w,i)=>i%4===0).slice(0,7).map(w=>w.storyId+':'+w.term);};
function seed(){return {read:['bookshop','tokyo','package'],savedWords:seededWords(),readingResults:{},examResults:[],afterStoryExam:true,level:'C2',length:10,model:'Gemini 3.1 Flash Lite',source:'stories',count:5,activeStory:null};}
function load(){try{const old=JSON.parse(localStorage.getItem(STORE));if(old&&Array.isArray(old.read)&&Array.isArray(old.savedWords)){return {...seed(),...old};}}catch(e){}return seed();}
let state=load(),session=null,showModal=null,selectedWord=null,currentTheme='',toastTimer=null;
const $=(id)=>document.getElementById(id);
const h=(x)=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}}
function go(route){const target='#'+route;if(location.hash===target){render();window.scrollTo(0,0);}else location.hash=target;}
function nav(active){const items=[['new','New Story'],['stories','My Stories'],['dictionary','Dictionary'],['exam','Exam'],['settings','Settings']];$('nav').innerHTML=items.map(([id,txt])=>`<a class="nav-link ${active===id?'active':''}" href="#${id}" ${active===id?'aria-current="page"':''}>${txt}</a>`).join('');}
function put(markup){$('app').innerHTML=markup;}
function iconBook(){return '<svg aria-hidden="true" viewBox="0 0 48 48" width="49" height="49" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M24 40c-6-4-12-5-20-3V9c9-2 15-1 20 3m0 28c6-4 12-5 20-3V9c-9-2-15-1-20 3m0 28V12"/></svg>';}
function options(items,selected,type){return `<div class="seg" role="group" aria-label="${type==='level'?'CEFR vocabulary level':'Reading duration'}">${items.map(v=>`<button type="button" class="${String(selected)===String(v)?'selected':''}" data-action="${type}" data-value="${v}" aria-pressed="${String(selected)===String(v)}">${v}${type==='length'?' min':''}</button>`).join('')}</div>`;}
function savedSet(){return new Set(state.savedWords);}
function allSaved(){const set=savedSet();return allWords().filter(w=>set.has(w.storyId+':'+w.term));}
function collection(){return state.source==='stories'?allWords():allSaved();}
function fmtCount(n,t){return `${n} ${n===1?t:t+'s'}`;}
function sectionLabel(type){return type==='reading'?'Reading comprehension':type==='dictionary'?'Dictionary vocabulary exam':'Past stories vocabulary exam';}
function renderHome(){nav('new');const examples=STORIES.slice(0,5);put(`<div class="container"><section class="hero"><div class="hero-icon">${iconBook()}</div><h1>Generate a Reading Story</h1><p>Create engaging stories at your level, build a reading habit, and grow your vocabulary.</p></section><section class="card story-form"><label class="field-label" for="theme">Theme <span class="optional">(optional)</span></label><input class="input" id="theme" placeholder="e.g. A rainy afternoon at a bookshop, a weekend in Tokyo..." value="${h(currentTheme)}"/><div class="examples"><p>Try an example</p><div class="chips">${examples.map(s=>`<button class="chip" data-action="example" data-id="${s.id}">${h(s.theme)}</button>`).join('')}</div></div><div class="form-divider"></div><div class="settings-grid"><div><label class="field-label">Vocabulary level <span class="help" title="Approximate CEFR difficulty">ⓘ</span></label>${options(['A1','A2','B1','B2','C1','C2'],state.level,'level')}</div><div><label class="field-label">Reading length</label>${options([5,10,15],state.length,'length')}</div><div><label class="field-label" for="model">Model</label><select class="select" id="model"><option>Gemini 3.1 Flash Lite</option><option>Gemini 2.5 Flash</option></select></div></div><button class="primary large" data-action="generate">Generate Story →</button><p class="form-note">Demo mode: opens a sample story. No real AI generation or API key needed.</p></section></div>`);$('model').value=state.model;}
function storyCard(s){const done=state.read.includes(s.id),res=state.readingResults[s.id];return `<section class="card story-tile"><div class="tile-meta"><span class="pill">${h(s.level)}</span><span class="pill">${s.minutes} min sample</span><span class="pill ${done?'green':'gray'}">${done?'✓ Read':'Not finished'}</span></div><h3>${h(s.title)}</h3><p>${h(s.description)}</p><div class="tile-actions"><button class="primary" data-action="open-story" data-id="${s.id}">${done?'Read again':'Read story'} →</button>${res?`<button class="text-button" data-action="open-reading-result" data-id="${s.id}">Last comprehension score: ${res.score}/${res.total}</button>`:''}</div></section>`;}
function renderStories(){nav('stories');put(`<div class="container"><div class="page-heading"><div class="eyebrow">YOUR READING LIBRARY</div><h1>My Stories</h1><p>Open a story, save words to your Dictionary, and finish reading to see the optional comprehension check.</p></div><div class="metrics"><div class="metric"><strong>${STORIES.length}</strong><span>Stories in library</span></div><div class="metric"><strong>${state.read.filter(id=>BY_ID[id]).length}</strong><span>Completed stories</span></div><div class="metric"><strong>${allSaved().length}</strong><span>Saved dictionary words</span></div></div><div class="section-head"><h2>All stories</h2><button class="text-button" data-action="navigate" data-route="exam">Go to vocabulary Exam →</button></div><div class="story-list">${STORIES.map(storyCard).join('')}</div></div>`);}
function wordify(p,story){const terms=[...story.words].sort((a,b)=>b.term.length-a.term.length).map(w=>w.term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));const regex=new RegExp('\\b('+terms.join('|')+')\\b','gi');return p.split(regex).map(piece=>{const w=story.words.find(w=>w.term.toLowerCase()===piece.toLowerCase());return w?`<button class="term" data-action="word-popup" data-id="${story.id}" data-word="${h(w.term)}" title="View meaning and save to Dictionary">${h(piece)}</button>`:h(piece)}).join('');}
function saveButton(storyId,term,small=false){const saved=state.savedWords.includes(storyId+':'+term);return `<button class="save-word ${saved?'saved':''}" data-action="toggle-word" data-id="${storyId}" data-word="${h(term)}">${saved?'✓ Saved':'＋ Save word'}</button>`;}
function renderReader(id){const s=BY_ID[id];if(!s)return go('stories');nav('stories');const res=state.readingResults[id],done=state.read.includes(id);put(`<div class="container"><div class="reader-top"><button class="back-link" data-action="navigate" data-route="stories">← My Stories</button><h1>${h(s.title)}</h1><div class="meta"><span class="pill">${h(s.level)}</span><span class="pill">${s.minutes} min sample</span><span class="pill ${done?'green':'gray'}">${done?'✓ Read':'Not finished'}</span></div></div><div class="reading-layout"><div><article class="card article-body">${s.paragraphs.map(p=>`<p>${wordify(p,s)}</p>`).join('')}</article><section class="end-card ${state.afterStoryExam?'':'off'}"><div class="eyebrow">YOU'VE REACHED THE END</div><h2>Finished reading?</h2><p>${state.afterStoryExam?'Finishing this story will open a short reading comprehension exam. You can skip the exam at any time.':'Finish this story and return to your library. The automatic reading exam prompt is turned off in Settings.'}</p><div class="end-actions"><button class="primary" data-action="finish-story" data-id="${s.id}">Finish reading →</button>${res?`<button class="secondary" data-action="open-reading-result" data-id="${s.id}">View previous result (${res.score}/${res.total})</button>`:''}</div><p class="end-info">Reading exam after each story: <strong>${state.afterStoryExam?'On':'Off'}</strong> · <a href="#settings">Change in Settings</a></p></section></div><aside class="reader-side"><div class="card side-panel"><h3>Words in this story</h3><p>Click a blue word in the article for its meaning. Save only the words you want to study later.</p>${s.words.map(w=>`<div class="vocab-mini"><b>${h(w.term)}</b><span>${h(w.definition)}</span>${saveButton(s.id,w.term,true)}</div>`).join('')}<p style="margin:14px 0 0">Saved words appear in <a href="#dictionary">Dictionary</a> and can be used in Exam.</p></div></aside></div></div>`);}
function renderDictionary(){nav('dictionary');const saved=allSaved();put(`<div class="container"><div class="page-heading"><div class="eyebrow">MY PERSONAL WORD BANK</div><h1>Dictionary</h1><p>Only words you explicitly save while reading appear here. Review them or choose Dictionary as the source for your vocabulary Exam.</p></div><div class="dict-summary"><div class="statline"><span class="pill blue">${fmtCount(saved.length,'saved word')}</span><span class="pill">From ${new Set(saved.map(w=>w.storyId)).size} stories</span></div><button class="primary" data-action="dictionary-exam" ${saved.length<2?'disabled':''}>Exam from my Dictionary →</button></div><div class="notice-strip">Demo starts with a few example words already saved. You can save or remove words in any story. Changes are stored in this browser.</div><div class="section-head"><h2>Saved words</h2><button class="text-button" data-action="navigate" data-route="stories">Browse stories →</button></div>${saved.length?`<div class="word-grid">${saved.map(w=>`<div class="card word-card"><div class="word-top"><h3 style="margin:0">${h(w.term)}</h3><span class="saved-chip">Saved</span></div><p>${h(w.definition)}</p><div class="word-actions"><span class="source">${h(w.part)} · ${h(w.story)}</span><button class="save-word saved" data-action="toggle-word" data-id="${w.storyId}" data-word="${h(w.term)}">Remove</button></div></div>`).join('')}</div>`:`<div class="empty-state"><h3>Your Dictionary is empty</h3><p>Open a story and save words to build your personal collection.</p><button class="secondary" data-action="navigate" data-route="stories">Explore stories →</button></div>`}</div>`);}
function renderExam(){nav('exam');const total=allWords().length,saved=allSaved().length;const selectedCount=collection().length;const latest=state.examResults.at(-1);put(`<div class="container"><div class="page-heading"><div class="eyebrow">VOCABULARY PRACTICE</div><h1>Test your vocabulary</h1><p>Select where your words come from. Both options test vocabulary, not reading comprehension.</p></div><div class="exam-container"><div class="section-caption">1 · Choose your question source</div><div class="source-grid"><button class="source-card ${state.source==='stories'?'active':''}" data-action="exam-source" data-value="stories" aria-pressed="${state.source==='stories'}"><div class="source-head"><span class="source-icon" aria-hidden="true">▤</span><span class="source-radio"></span></div><h3>From past stories</h3><p>Randomly quiz me on vocabulary appearing across all the stories in My Stories, including words I haven't saved.</p><span class="source-meta">${STORIES.length} stories · ${total} available words</span></button><button class="source-card ${state.source==='dictionary'?'active':''}" data-action="exam-source" data-value="dictionary" aria-pressed="${state.source==='dictionary'}"><div class="source-head"><span class="source-icon" aria-hidden="true">▧</span><span class="source-radio"></span></div><h3>From my Dictionary</h3><p>Only quiz me on words I've intentionally saved while reading. Great for reviewing my personal vocabulary list.</p><span class="source-meta">${saved} saved words · ${new Set(allSaved().map(w=>w.storyId)).size} source stories</span></button></div><div class="section-caption">2 · Set up your exam</div><div class="exam-actions-card"><div class="controls"><div><label class="field-label">Number of questions</label><div class="seg" role="group" aria-label="Number of questions">${[5,10].map(n=>`<button data-action="exam-count" data-value="${n}" class="${state.count===n?'selected':''}" ${selectedCount<n?'disabled':''}>${n} questions</button>`).join('')}</div></div><button class="primary" data-action="start-exam" ${!selectedCount?'disabled':''}>Start vocabulary exam →</button></div><p class="exam-subtle">${!selectedCount?'No words available in this source yet. Save words to your Dictionary first.':`Questions are selected at random from ${state.source==='stories'?'all your existing stories':'your saved Dictionary words'}. Answers and explanations appear after you submit.`}</p>${latest?`<div class="example-state"><span class="topic-dot"></span>Last exam: ${h(sectionLabel(latest.source))} · ${latest.score}/${latest.total} <button class="text-button" data-action="latest-exam">View result →</button></div>`:''}</div><div class="how-it-works"><h2>How exams work</h2><div class="flow-band" style="border-top:0;margin-top:12px;padding-top:0"><div class="mini-flow"><b>After a story · Reading comprehension</b><span>Finish story → Reading exam (controlled in Settings) → Results. This checks your understanding of that article.</span></div><div class="mini-flow"><b>Exam tab · Vocabulary</b><span>Pick past stories or saved Dictionary words → Random vocabulary questions → Results. Independent of the Setting.</span></div></div></div></div></div>`);}
function shuffled(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a;}
function makeQuestions(source,n,restricted=null){let pool=source==='dictionary'?allSaved():allWords();if(restricted)pool=pool.filter(w=>restricted.includes(w.storyId+':'+w.term));const chosen=shuffled(pool).slice(0,Math.min(n,pool.length));const dictionary=allWords();return chosen.map((w,i)=>{const available=shuffled(dictionary.filter(x=>x.term!==w.term&&x.definition!==w.definition)).map(x=>x.definition);const answers=shuffled([w.definition,...available.slice(0,3)]);return {question:i%2===0?`In the sentence “${w.example}”, what does “${w.term}” mean?`:`Which definition best matches “${w.term}”?`,options:answers,correct:answers.indexOf(w.definition),explanation:`“${w.term}” means ${w.definition}. It appeared in “${w.story}.”`,wordKey:w.storyId+':'+w.term,story:w.story,word:w.term};});}
function startExam(terms=null){let source=state.source;const candidates=source==='dictionary'?allSaved():allWords();if(!candidates.length)return;const questions=makeQuestions(source,terms?terms.length:state.count,terms);if(!questions.length)return;session={type:'vocabulary',source,questions,index:0,answers:[]};go('quiz');}
function startReading(id){const s=BY_ID[id];if(!s)return;session={type:'reading',storyId:id,questions:s.questions.map(q=>({question:q.q,options:q.options,correct:q.correct,explanation:q.explanation})),index:0,answers:[]};showModal=null;go('quiz');}
function renderQuiz(){if(!session){go('exam');return}nav(session.type==='reading'?'stories':'exam');const q=session.questions[session.index],value=session.answers[session.index],progress=100*(session.index+1)/session.questions.length;const reading=session.type==='reading';put(`<div class="quiz-wrap"><button class="back-link" data-action="quit-quiz">← ${reading?'Skip exam':'Exit exam'}</button><div class="quiz-head"><div class="eyebrow">${reading?'READING COMPREHENSION':'VOCABULARY EXAM'}</div><h1>${reading?'Check your understanding':'Vocabulary practice'}</h1><p>${reading?h(BY_ID[session.storyId].title):`Questions ${session.source==='stories'?'from past stories':'from your saved Dictionary words'}. Select one answer per question.`}</p>${reading?'':`<span class="quiz-source">Source: ${session.source==='stories'?'All past stories':'My Dictionary'}</span>`}</div><div class="progress-row"><span>Question ${session.index+1} of ${session.questions.length}</span><span>${Math.round(progress)}%</span></div><div class="progress-track" role="progressbar" aria-valuenow="${Math.round(progress)}" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" style="width:${progress}%"></div></div><section class="card quiz-card"><div class="quiz-kind">${reading?'Article comprehension':'Vocabulary in context'}</div><h2 class="quiz-question">${h(q.question)}</h2><div class="answer-list">${q.options.map((o,j)=>`<button class="answer ${value===j?'selected':''}" data-action="choose" data-value="${j}" aria-pressed="${value===j}"><span class="letter">${'ABCD'[j]}</span><span>${h(o)}</span></button>`).join('')}</div><div class="quiz-footer"><button class="secondary" data-action="previous" ${session.index===0?'disabled':''}>← Previous</button><button class="primary" data-action="next" ${value===undefined?'disabled':''}>${session.index+1===session.questions.length?'Submit exam':'Next question →'}</button></div></section><p class="quiz-support">You can revisit answers before submitting. Explanations are shown in the results.</p></div>`);}
function finishExam(){if(!session)return;const result={type:session.type,source:session.source||null,storyId:session.storyId||null,score:session.questions.reduce((a,q,i)=>a+(q.correct===session.answers[i]?1:0),0),total:session.questions.length,questions:session.questions,answers:session.answers.slice(),createdAt:new Date().toISOString()};if(result.type==='reading'){state.readingResults[result.storyId]=result;}else{state.examResults.push(result);if(state.examResults.length>30)state.examResults.shift();}persist();session=null;go(result.type==='reading'?`result/reading/${result.storyId}`:'result/vocabulary');}
function renderResult(type,id){const r=type==='reading'?state.readingResults[id]:state.examResults.at(-1);if(!r){go(type==='reading'?'stories':'exam');return;}nav(type==='reading'?'stories':'exam');const pct=Math.round(r.score/r.total*100),wrong=r.questions.filter((q,i)=>q.correct!==r.answers[i]);put(`<div class="results-wrap"><button class="back-link" data-action="navigate" data-route="${type==='reading'?'story/'+id:'exam'}">← ${type==='reading'?'Back to story':'Back to Exam'}</button><div class="result-hero"><div class="score-circle">${pct}%</div><div class="eyebrow">EXAM COMPLETE</div><h1>${pct===100?'Excellent work!':pct>=70?'Nice work — keep going!':'Keep practicing — you’re learning.'}</h1><p>You answered ${r.score} of ${r.total} questions correctly. Review the answers below.</p><span class="pill blue">${type==='reading'?'Reading comprehension':`Vocabulary · ${r.source==='stories'?'Past stories':'My Dictionary'}`}</span></div><div class="result-actions"><button class="primary" data-action="retake" data-type="${type}" data-id="${id||''}">Retake exam ↻</button>${type==='vocabulary'&&wrong.length?`<button class="secondary" data-action="missed">Practice ${wrong.length} missed word${wrong.length===1?'':'s'}</button>`:''}<button class="secondary" data-action="navigate" data-route="${type==='reading'?'stories':'exam'}">${type==='reading'?'My Stories':'Back to Exam'}</button></div><div class="section-head"><h2>Answer review</h2><span class="small muted">${wrong.length} to review</span></div><div class="review-list">${r.questions.map((q,i)=>{const good=r.answers[i]===q.correct;return `<div class="card review-item"><div class="review-top"><h3>${i+1}. ${h(q.question)}</h3><span class="status-icon ${good?'correct':'wrong'}">${good?'✓ Correct':'✕ Review'}</span></div>${!good?`<div class="review-answer">Your answer: <strong>${h(q.options[r.answers[i]]||'Not answered')}</strong></div>`:''}<div class="review-answer">Correct answer: <strong>${h(q.options[q.correct])}</strong></div><p>${h(q.explanation)}</p></div>`}).join('')}</div></div>`);}
function renderSettings(){nav('settings');put(`<div class="container"><div class="page-heading"><div class="eyebrow">PREFERENCES</div><h1>Settings</h1><p>Customize how reading and exams fit into your routine.</p></div><div class="card settings-panel"><div class="setting-block"><div class="section-caption">EXAMS</div><div class="setting-row"><div><h3>Offer an exam after each story</h3><p class="switch-label">When enabled, finishing a story takes you to a short reading comprehension exam, which you can skip. When disabled, finishing a story simply marks it as read.</p></div><button id="exam-switch" class="switch ${state.afterStoryExam?'on':''}" data-action="toggle-auto" aria-label="Offer an exam after each story" role="switch" aria-checked="${state.afterStoryExam}"></button></div><div class="example-state"><span class="tag-soft">${state.afterStoryExam?'Enabled':'Disabled'}</span>${state.afterStoryExam?'A reading comprehension exam opens after you finish a story.':'No automatic exam prompt after reading.'}</div></div><hr/><div class="setting-block"><label class="field-label">Default vocabulary level</label>${options(['A1','A2','B1','B2','C1','C2'],state.level,'level')}<p>Approximate CEFR difficulty for generated stories.</p></div><div class="setting-block"><label class="field-label">Preferred reading length</label>${options([5,10,15],state.length,'length')}<p>Choose your reading duration for new stories.</p></div><div class="setting-block"><label class="field-label" for="settings-model">Model</label><select id="settings-model" class="select"><option>Gemini 3.1 Flash Lite</option><option>Gemini 2.5 Flash</option></select><p>Visual preference only in this prototype.</p></div><hr/><div class="setting-block"><label class="field-label">Gemini API key</label><p>Not required for this sample prototype. Preview the first-time setup screen without entering a real key.</p><button class="secondary" data-action="api-preview">Preview API key dialog →</button></div><hr/><div class="setting-block" style="margin:0"><label class="field-label">Demo progress</label><p>Reset the saved Dictionary words, reading completion, exam scores, and preferences to initial sample values.</p><button class="secondary" data-action="reset">Reset demo progress</button></div></div></div>`);$('settings-model').value=state.model;}
function renderModal(){if(!showModal){$('modal-host').innerHTML='';return;}if(showModal.type==='reading'){const s=BY_ID[showModal.id];$('modal-host').innerHTML=`<div class="overlay" data-action="overlay"><div class="modal prompt" role="dialog" aria-modal="true" aria-labelledby="prompt-heading"><button class="close-modal" data-action="close-modal" aria-label="Close dialog">×</button><div class="prompt-illustration">${iconBook()}</div><h2 id="prompt-heading">Ready to check your understanding?</h2><p class="desc">You’ve finished <strong>${h(s.title)}</strong>. Want to take a short, 4-question reading comprehension exam?</p><div class="dialog-actions"><button class="secondary" data-action="skip-reading">Not now</button><button class="primary" data-action="begin-reading" data-id="${s.id}">Start reading exam →</button></div><p class="form-note">You can turn off this prompt anytime in Settings.</p></div></div>`;}else{$('modal-host').innerHTML=`<div class="overlay" data-action="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="api-heading"><button class="close-modal" data-action="close-modal" aria-label="Close dialog">×</button><h2 id="api-heading">You're one step away from your story</h2><p class="desc">Add your Gemini API key to generate your first reading story.</p><label for="api-demo" class="field-label">Gemini API key</label><input id="api-demo" class="input" type="password" placeholder="API key (visual preview only)" autocomplete="off"/><div class="guide"><h3>How to get your API key</h3><ol><li>Open <a href="https://aistudio.google.com/apikey" rel="noopener noreferrer" target="_blank">Google AI Studio</a> and sign in.</li><li>Go to API Keys and create or copy a key.</li><li>Paste the key in the live app.</li></ol></div><p class="notice">Demo only: this form does not save, send, or verify any keys. Do not enter a real key.</p><div class="modal-actions"><button class="secondary" data-action="close-modal">Close preview</button></div></div></div>`;}}
function renderWord(){if(!selectedWord){$('dict-host').innerHTML='';return;}const w=selectedWord,already=state.savedWords.includes(w.storyId+':'+w.term);$('dict-host').innerHTML=`<aside class="dictionary-pop" role="status" style="min-width:285px;max-width:380px"><button data-action="close-word" aria-label="Close definition">×</button><h3>${h(w.term)}</h3><p>${h(w.definition)}</p><p class="word-source">Example: ${h(w.example)}</p><div style="margin-top:12px">${saveButton(w.storyId,w.term)}</div><p style="margin-top:7px;font-size:11px">${already?'Saved to Dictionary':'Save this word to study it in Exam.'}</p></aside>`;}
function render(){const [page,p1,p2]=decodeURIComponent(location.hash.slice(1)||'new').split('/');switch(page){case 'new':renderHome();break;case 'stories':renderStories();break;case 'story':renderReader(p1);break;case 'dictionary':renderDictionary();break;case 'exam':renderExam();break;case 'settings':renderSettings();break;case 'quiz':renderQuiz();break;case 'result':renderResult(p1,p2);break;default:renderHome();}renderModal();renderWord();}
function onAction(act,el){const id=el.dataset.id,word=el.dataset.word,val=el.dataset.value;switch(act){case 'navigate':go(el.dataset.route);break;case 'open-story':go('story/'+id);break;case 'open-reading-result':go('result/reading/'+id);break;case 'example':currentTheme=BY_ID[id].theme;render();$('theme')?.focus();break;case 'level':state.level=val;persist();render();break;case 'length':state.length=Number(val);persist();render();break;case 'generate':{const t=($('theme')?.value||'').trim().toLowerCase();let s=STORIES.find(s=>s.theme.toLowerCase()===t)||STORIES.find(s=>t.length>3&&s.theme.toLowerCase().includes(t))||STORIES[0];state.activeStory=s.id;persist();go('story/'+s.id);break;}case 'finish-story':{if(!state.read.includes(id))state.read.push(id);persist();if(state.afterStoryExam){startReading(id);}else go('stories');break;}case 'begin-reading':startReading(id);break;case 'skip-reading':showModal=null;renderModal();go('stories');break;case 'word-popup':{selectedWord=allWords().find(w=>w.storyId===id&&w.term.toLowerCase()===word.toLowerCase());renderWord();break;}case 'close-word':selectedWord=null;renderWord();break;case 'toggle-word':{const key=id+':'+word;if(state.savedWords.includes(key)){state.savedWords=state.savedWords.filter(x=>x!==key);}else state.savedWords.push(key);persist();const page=location.hash.slice(1).split('/')[0];if(page==='dictionary'||page==='story')render();else renderWord();break;}case 'dictionary-exam':state.source='dictionary';state.count=5;persist();go('exam');break;case 'exam-source':state.source=val;if(collection().length<state.count)state.count=5;persist();render();break;case 'exam-count':state.count=Number(val);persist();render();break;case 'start-exam':startExam();break;case 'choose':session.answers[session.index]=Number(val);render();break;case 'previous':if(session&&session.index>0)session.index--;render();break;case 'next':if(!session||session.answers[session.index]===undefined)break;if(session.index===session.questions.length-1)finishExam();else{session.index++;render();}break;case 'quit-quiz':{const dest=session?.type==='reading'?'stories':'exam';session=null;go(dest);break;}case 'retake':{if(el.dataset.type==='reading'){startReading(id);}else{const last=state.examResults.at(-1);state.source=last.source;state.count=last.total;persist();startExam();}break;}case 'missed':{const r=state.examResults.at(-1);state.source=r.source;persist();startExam(r.questions.filter((q,i)=>q.correct!==r.answers[i]).map(q=>q.wordKey));break;}case 'latest-exam':go('result/vocabulary');break;case 'toggle-auto':state.afterStoryExam=!state.afterStoryExam;persist();render();break;case 'api-preview':showModal={type:'api'};renderModal();break;case 'close-modal':showModal=null;renderModal();break;case 'overlay':showModal=null;renderModal();break;case 'reset':if(confirm('Reset the prototype to its starting demo state?')){state=seed();session=null;selectedWord=null;currentTheme='';persist();go('settings')}break;}}
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el)return;if(el.dataset.action==='overlay'&&event.target!==el)return;event.preventDefault();onAction(el.dataset.action,el);});
document.addEventListener('input',event=>{if(event.target.id==='theme')currentTheme=event.target.value;});
document.addEventListener('change',event=>{if(event.target.id==='model'||event.target.id==='settings-model'){state.model=event.target.value;persist();}});
window.addEventListener('hashchange',()=>{selectedWord=null;render();window.scrollTo(0,0);});
window.addEventListener('keydown',event=>{if(event.key==='Escape'){showModal=null;selectedWord=null;renderModal();renderWord();}});
render();
})();

</script></body></html>
